<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile</title>
<script>
  // Theme: light is the default, dark via browser preference, overridable with
  // ?theme=light|dark — the open-bot dashboard toggle drives this parameter on
  // the proxied page. Set before the CSS so there is no flash. No custom toggle.
  (function () {
    var apply = function () {
      var q = null;
      try { q = new URLSearchParams(location.search).get("theme"); } catch (e) {}
      var dark = q === "dark" || (q !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.removeAttribute("data-theme");
    };
    apply();
    try {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) mq.addEventListener("change", function () { if (!new URLSearchParams(location.search).get("theme")) apply(); });
    } catch (e) {}
  })();
</script>
<style>
/* My Profile — dashboard page styles.
   Light values live in :root; dark overrides are flat rules on
   html[data-theme="dark"] — the dashboard toggle drives the attribute through
   ?theme=light|dark (script in <head> before this stylesheet, zero flash).
   No custom theme toggle in the page. */
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #1c2430;
  --muted: #5c6773;
  --border: #d8dee6;
  --accent: #2563eb;
  --accent-text: #ffffff;
  --danger: #b91c1c;
  --danger-bg: #fee2e2;
  --ok: #166534;
  --ok-bg: #dcfce7;
  --input-bg: #ffffff;
  --sensitive-note-bg: #fff7ed;
  --sensitive-note-border: #f59e0b;
  --sensitive-note-text: #7c4a03;
  --pill-ok: #166534;
  --pill-ok-bg: rgba(22, 163, 74, 0.14);
  --pill-off: #475569;
  --pill-off-bg: rgba(100, 116, 139, 0.14);
  --row-border: #e5e9f0;
}
html[data-theme="dark"] {
  --bg: #14181f;
  --card: #1d232c;
  --text: #e8ecf1;
  --muted: #9aa7b4;
  --border: #333d4a;
  --accent: #4f8ef7;
  --accent-text: #0b1220;
  --danger: #f87171;
  --danger-bg: #3a1a1a;
  --ok: #4ade80;
  --ok-bg: #14301c;
  --input-bg: #141a22;
  --sensitive-note-bg: #2b2110;
  --sensitive-note-border: #b45309;
  --sensitive-note-text: #fbbf24;
  --pill-ok: #4ade80;
  --pill-ok-bg: rgba(74, 222, 128, 0.12);
  --pill-off: #94a3b8;
  --pill-off-bg: rgba(148, 163, 184, 0.12);
  --row-border: #2a3340;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px 60px;
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
}
.wrap { max-width: 760px; margin: 0 auto; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
h1 { font-size: 22px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
.langbtn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer;
}
.banner {
  display: none; background: var(--danger-bg); color: var(--danger);
  border: 1px solid var(--danger); border-radius: 10px;
  padding: 10px 14px; margin: 0 0 16px; font-size: 14px; white-space: pre-wrap;
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin: 0 0 4px; }
.card .desc { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
.f { display: flex; flex-direction: column; gap: 4px; }
.f.wide { grid-column: 1 / -1; }
label { font-size: 12.5px; color: var(--muted); }
input {
  background: var(--input-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 14px; width: 100%;
}
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.senswrap { position: relative; }
.senswrap input { padding-right: 44px; letter-spacing: 1px; }
.eye {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 14px; padding: 4px 6px;
}
.note {
  background: var(--sensitive-note-bg); color: var(--sensitive-note-text);
  border-left: 3px solid var(--sensitive-note-border);
  border-radius: 6px; padding: 8px 12px; font-size: 12.5px; margin: 0 0 14px;
}
.actions { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
button.save {
  background: var(--accent); color: var(--accent-text);
  border: none; border-radius: 8px; padding: 8px 18px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button.save:disabled { opacity: 0.55; cursor: default; }
.status { font-size: 13px; }
.status.ok { color: var(--ok); }
.status.err { color: var(--danger); }
footer { color: var(--muted); font-size: 12px; margin-top: 22px; }
.cardrow {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 0; border-top: 1px solid var(--row-border); font-size: 14px;
}
.cardrow:first-child { border-top: none; }
.cardrow .grow { flex: 1; min-width: 160px; }
.pill {
  font-size: 11.5px; font-weight: 600; border-radius: 999px;
  padding: 2px 10px; text-transform: lowercase; white-space: nowrap;
}
.pill.active { color: var(--pill-ok); background: var(--pill-ok-bg); }
.pill.inactive { color: var(--pill-off); background: var(--pill-off-bg); }
.badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; }
.minibtn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 7px; padding: 3px 10px; font-size: 12.5px; cursor: pointer;
}
.minibtn:hover { color: var(--text); }
.minibtn.danger { color: var(--danger); border-color: var(--danger); }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
.addgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
@media (max-width: 640px) { .addgrid { grid-template-columns: 1fr 1fr; } }
select {
  background: var(--input-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 14px; width: 100%;
}
select option { background: var(--input-bg); color: var(--text); }

</style>
</head>
